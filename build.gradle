plugins {
	id 'fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// JCodec (pure-Java H.264 decoder) lives on Maven Central.
	mavenCentral()
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"falcraft" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	// JCodec: pure-Java H.264/mp4 decoder for /fal video frame extraction.
	// 'include' bundles it into the built jar (Fabric jar-in-jar) so users need no extra install.
	implementation "org.jcodec:jcodec:0.2.5"
	implementation "org.jcodec:jcodec-javase:0.2.5"
	include "org.jcodec:jcodec:0.2.5"
	include "org.jcodec:jcodec-javase:0.2.5"
}

// Headless splat->voxel test harness (no Minecraft launch). Usage:
//   gradlew voxelizeWorld "-Pspz=path\to\world.spz" "-Pjson=path\to\0-world.json" ["-Pbpm=1.0"] ...
tasks.register('voxelizeWorld', JavaExec) {
	group = 'falcraft'
	description = 'Voxelize a Marble .spz (or .splat) world and write PLY/PNG previews'
	classpath = sourceSets.client.runtimeClasspath
	mainClass = 'com.falcraft.tools.WorldVoxelizerHarness'
	def harnessArgs = []
	['spz', 'glb', 'json', 'bpm', 'opacity', 'density', 'maxAxis', 'clip', 'belowGround', 'radiusM', 'out'].each { key ->
		if (project.hasProperty(key)) {
			harnessArgs += ["--${key}".toString(), project.property(key).toString()]
		}
	}
	args = harnessArgs
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}